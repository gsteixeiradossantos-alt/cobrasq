<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Emissão de NFS-e em lote</title>
</head>
<body>
  <header>
    <h1>NFS-e em lote <span class="tag">COBRASQ</span> <span class="ver" id="ver" title="versão carregada agora"></span></h1>
    <p class="sub">Prestador fixo · Dois Vizinhos/PR · Cobrança em geral (17.22.01.000) · alíquota 2,01</p>
  </header>

  <div id="aviso" class="aviso hidden"></div>

  <section>
    <div class="secHd">
      <label>Tomadores</label>
      <span class="hint">o nome vem do próprio ESNFS pelo CPF</span>
    </div>

    <div class="tbl">
      <div class="thead">
        <span class="cN">#</span>
        <span class="cD">CPF / CNPJ</span>
        <span class="cV">Valor (R$)</span>
        <span class="cA"></span>
      </div>
      <div id="linhas"></div>
    </div>

    <div class="row">
      <button id="addLinha" class="ghost">+ Adicionar tomador</button>
      <span id="resumo" class="resumo"></span>
    </div>
  </section>

  <section>
    <label class="chk"><input type="checkbox" id="confirmFirst" checked /> Pedir confirmação antes de gravar a 1ª NF</label>
    <label class="chk"><input type="checkbox" id="confirmEach" /> Pedir confirmação antes de <b>cada</b> NF</label>
    <label class="chk"><input type="checkbox" id="dryRun" /> Simulação — preencher a 1ª NF sem gravar</label>
  </section>

  <details>
    <summary>Constantes e endereço padrão</summary>
    <div class="grid">
      <label>Alíquota <input id="aliquota" type="text" /></label>
      <label>Cód. do serviço (value) <input id="servicoValue" type="text" /></label>
      <label class="full">Texto do serviço (fallback) <input id="servicoMatch" type="text" /></label>
      <label class="full">Discriminação <textarea id="discriminacao" rows="3"></textarea></label>
      <p class="full nota">Endereço padrão — usado quando o ESNFS não traz o endereço do tomador,
        que é o caso mais comum.</p>
      <label class="full">Logradouro <input id="eLog" type="text" /></label>
      <label>Número <input id="eNum" type="text" /></label>
      <label>Bairro <input id="eBai" type="text" /></label>
      <label>CEP <input id="eCep" type="text" /></label>
      <label>UF <input id="eUf" type="text" maxlength="2" /></label>
      <label class="full">Cidade <input id="eCid" type="text" /></label>
      <button id="restaurar" class="ghost small">Restaurar padrões COBRASQ</button>
    </div>
  </details>

  <footer>
    <button id="iniciar" class="primary">Iniciar emissão</button>
    <button id="relatorio" class="ghost">Relatório</button>
    <button id="limpar" class="ghost">Limpar</button>
  </footer>

  <div id="status" class="status"></div>

  <!-- molde de uma linha de tomador -->
  <template id="tplLinha">
    <div class="lin">
      <div class="linTop">
        <span class="cN num"></span>
        <span class="cD"><input type="text" class="fDoc" inputmode="numeric" maxlength="18" placeholder="000.000.000-00" /></span>
        <span class="cV"><input type="text" class="fVal" inputmode="decimal" placeholder="0,00" /></span>
        <span class="cA">
          <button class="mini bMais" title="Dados do tomador (só se o ESNFS não achar o cadastro)">⌄</button>
          <button class="mini bDel" title="Remover esta linha">✕</button>
        </span>
      </div>
      <div class="linErr"></div>
      <div class="linMais hidden">
        <p class="nota">Preencha só se o ESNFS <b>não</b> encontrar o cadastro deste CPF.
          O que estiver em branco cai no endereço padrão.</p>
        <div class="g3">
          <label class="span2">Nome / Razão social <input type="text" class="fNome" /></label>
          <label>Telefone <input type="text" class="fTel" inputmode="numeric" /></label>
        </div>
        <div class="g3">
          <label class="span3">E-mail <input type="text" class="fMail" inputmode="email" /></label>
        </div>
        <div class="g3">
          <label class="span2">Logradouro <input type="text" class="fLog" /></label>
          <label>Número <input type="text" class="fNum" /></label>
        </div>
        <div class="g3">
          <label>Bairro <input type="text" class="fBai" /></label>
          <label>CEP <input type="text" class="fCep" inputmode="numeric" maxlength="9" /></label>
          <label>Cidade / UF <input type="text" class="fCid" placeholder="Dois Vizinhos/PR" /></label>
        </div>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
