# Portal do devedor: chamada com a anon key, e a prova de posse é o token de
# sessão validado server-side pela RPC quita_oferta.
[functions.quita-fechar]
verify_jwt = true

# Nunca publicada. Valida por auth.getUser() no próprio código.
[functions.gerar-peticao-pdf]
verify_jwt = true

# Nunca publicada. NÃO tem checagem própria — se subir com false vira endpoint
# aberto que escreve na agenda do escritório. Mantenha true.
[functions.google-calendar-sync]
verify_jwt = true

# ── Webhooks de terceiro e crons: validam segredo próprio ────────────────────
[functions.asaas-webhook]
verify_jwt = false

[functions.zapsign-webhook]
verify_jwt = false

[functions.zapsign-lembrete-rapido]
