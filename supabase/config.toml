# Nunca publicada. Valida ESCAVADOR_WEBHOOK_TOKEN em tempo constante.
[functions.escavador-webhook]
verify_jwt = false

# ── Bancadas de teste ────────────────────────────────────────────────────────
# Sem autenticação própria: respondem a qualquer POST. Declaradas com o valor que
# já têm em produção para o deploy não mudar o comportamento por acidente — mas
# são candidatas a remoção, não modelo a seguir.
[functions.bia-chat-teste]
verify_jwt = false

[functions.carlos-teste]
verify_jwt = false
