# Declaração das Edge Functions — a casa do `verify_jwt`.
#
# POR QUE ESTE ARQUIVO EXISTE
# Sem ele, `supabase functions deploy <slug>` sobe a função com verify_jwt LIGADO
# por padrão. Já derrubou a `bia-cobranca` em produção (25-26/08/2026): o gateway
# passou a rejeitar o token custom do cron e cada ciclo virava `POST | 401`, com o
# `cron.job_run_details` marcando "succeeded" — porque o pg_net recebeu resposta
# HTTP; ela é que era 401. O defeito ficou invisível por um dia.
#
# Com as funções declaradas aqui, o valor certo passa a ser propriedade do REPO, e
# não da memória de quem deploya. Vale para o CI e para o deploy manual.
#
# COMO ESCOLHER O VALOR
#   verify_jwt = true   → só quem tem JWT do Supabase chama. É o padrão seguro.
#                         Use quando o app (usuário logado) é o chamador.
#   verify_jwt = false  → o gateway não exige JWT. SÓ para quem não tem como
#                         mandar um: webhook de terceiro (Asaas, ZapSign, Z-API,
#                         Escavador) e cron com segredo próprio. Nesses casos a
#                         função TEM de validar o segredo dela no corpo do código.
#
# Os valores abaixo foram MEDIDOS contra produção em 31/08/2026 (POST sem header:
# `UNAUTHORIZED_NO_AUTH_HEADER` = true; resposta da própria função = false), não
# transcritos de memória. As três marcadas como "nunca publicada" foram decididas
# lendo o código — não havia valor em produção para copiar.

project_id = "jokbxzhcctcwnbhkhgru"

# ── Chamadas pelo app, com usuário logado ────────────────────────────────────
[functions.beatriz-msg]
verify_jwt = true

[functions.bia-atendimento]
verify_jwt = true

[functions.carlos-iniciar]
verify_jwt = true

[functions.criar-usuario]
