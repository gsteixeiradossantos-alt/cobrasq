<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conferência de títulos · COBRASQ</title>
<!-- Bancada de conferência por link (migração 20261020_conferencia_link). O credor sem login
     abre painel.cobrasq.com.br/conferencia#<token>. O token fica no fragmento (#), que o
     navegador não manda ao servidor nem a terceiros. Tudo passa pelas RPCs
     conferencia_por_link / conferencia_responder_link; o anon não lê tabela nenhuma. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
:root{
  --paper:#EFEAD9; --paper-2:#E2DBC6; --card-warm:#FBF8EF; --cream:#EFEAD9;
  --ink:#0A1530; --ink-2:#15224A; --pgold:#C9A961; --gold-2:#9C7F40;
  --pline:rgba(10,21,48,.12); --mute:rgba(10,21,48,.55);
  --st-quitado:#5E7C58; --st-semexito:#A65A4A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:'Inter Tight',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
.topo{background:var(--ink);color:var(--cream);padding:18px 16px;border-bottom:1px solid var(--pgold);}
.topo-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.marca{font-family:'Fraunces',serif;font-weight:300;font-size:26px;letter-spacing:-.01em;color:var(--cream);}
.marca::after{content:'.';color:var(--pgold);}
.ponto{width:12px;height:12px;border-radius:50%;background:var(--pgold);flex:none;}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 64px;}
.h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(28px,6vw,42px);letter-spacing:-.02em;line-height:1.05;}
.lead{font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:var(--mute);margin-top:6px;}
.card{background:var(--card-warm);border:1px solid var(--pline);border-radius:18px;padding:20px 22px;margin-bottom:14px;}
.label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--pline);background:transparent;color:var(--ink);border-radius:11px;padding:7px 13px;cursor:pointer;}
.chip{font:inherit;font-size:12px;border:1px solid var(--pline);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink);}
textarea{width:100%;padding:10px 12px;border:1px solid var(--pline);background:var(--paper);border-radius:10px;font:inherit;font-size:14px;color:var(--ink);outline:none;resize:vertical;}
textarea:focus{border-color:var(--gold-2);}
.devedor{font-family:'Fraunces',serif;font-size:19px;}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px;}
.perg{padding:14px 0;border-top:1px solid var(--pline);}
.perg-q{font-size:14px;font-weight:600;margin-bottom:8px;}
.perg-pe{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:12px;}
.barra{height:4px;border-radius:2px;background:var(--pline);margin-top:12px;overflow:hidden;}
.barra>div{height:100%;background:var(--pgold);}
.ok{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--st-quitado);}
.erro{color:var(--st-semexito);}
.rodape{max-width:880px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--mute);}
</style>
</head>
<body>
<header class="topo"><div class="topo-in"><span class="ponto"></span><span class="marca">cobrasq</span></div></header>
<main class="wrap" id="app">
  <div class="card" style="text-align:center;padding:32px;color:var(--mute);">Carregando…</div>
</main>
<footer class="rodape">Esta página é só sua. Não encaminhe o link. Dúvidas: WhatsApp (46) 98822-6533.</footer>
<script>
(function(){
  const app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtD=s=>{ const d=new Date(s); return isNaN(d)?'':d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
  const token=(location.hash||'').replace(/^#/,'').trim().toLowerCase();
  let supa=null, st={ cliente:'', itens:[], perg:[] }, filtro='todos';

  const cabeca=()=>`<div style="margin-bottom:18px;"><div class="h1">Conferência de títulos</div>
    <div class="lead">${st.cliente?esc(st.cliente)+', estes':'Estes'} são os títulos que você nos entregou. Confira cada um e responda o que souber: a resposta fica salva assim que você sai do campo.</div></div>`;
  const aviso=(t,s)=>{ app.innerHTML=`<div style="margin-bottom:18px;"><div class="h1">Conferência de títulos</div></div>
    <div class="card" style="text-align:center;padding:36px;"><div class="devedor" style="margin-bottom:6px;">${esc(t)}</div><div style="color:var(--mute);">${esc(s)}</div></div>`; };

  const status=p=>p.resposta?`<span style="color:var(--st-quitado);">Respondida${p.respondida_em?' em '+fmtD(p.respondida_em):''}</span>`:`<span style="color:var(--mute);">Sem resposta</span>`;
  const okItem=id=>{ const ps=st.perg.filter(p=>String(p.item_id)===String(id)); return ps.length && ps.every(p=>p.resposta); };

  function desenhar(){
    const { itens, perg }=st;
    const total=perg.length, feitas=perg.filter(p=>p.resposta).length;
    if(!total){ aviso('Nada para conferir','Quando houver títulos para conferir, eles aparecem aqui.'); return; }
    const pct=Math.round(feitas*100/total);
    // O que foi digitado e ainda não salvo sobrevive ao redesenho (ex.: troca de filtro).
    const rasc={};
    app.querySelectorAll('textarea[data-id]').forEach(t=>{ rasc[t.dataset.id]=t.value; });
    const pergHtml=(p,n)=>`<div class="perg">
        <div class="perg-q">${n}. ${esc(p.pergunta)}</div>
        <textarea id="r-${esc(p.id)}" data-id="${esc(p.id)}" rows="2" maxlength="4000" placeholder="Sua resposta">${esc(p.resposta||'')}</textarea>
        <div class="perg-pe"><span id="s-${esc(p.id)}">${status(p)}</span><button class="btn" data-salvar="${esc(p.id)}">Salvar</button></div></div>`;
    const lista=rows=>rows.length?`<div style="display:flex;flex-direction:column;gap:6px;">${rows.map(r=>`<div><span style="color:var(--mute);">${esc(r.rotulo)}:</span> ${esc(r.valor)}</div>`).join('')}</div>`:'';
    const gerais=perg.filter(p=>!p.item_id);
    const cardGeral=gerais.length?`<div class="card"><div class="label" style="margin-bottom:4px;">Para todos os títulos</div>${gerais.map((p,i)=>pergHtml(p,i+1)).join('')}</div>`:'';
    const cards=itens.map(it=>{
      const ps=perg.filter(p=>String(p.item_id)===String(it.id));
      if(filtro==='faltam' && ps.every(p=>p.resposta)) return '';
      const d=it.dados||{}, lido=lista(d.lido||[]), cad=lista(d.cadastro||[]);
      const nota=d.cadastro_nota?`<div style="color:var(--mute);">${esc(d.cadastro_nota)}</div>`:'';
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">
          <div class="devedor">${esc(it.devedor)}</div><span id="ok-${esc(it.id)}">${okItem(it.id)?'<span class="ok">CONFERIDO</span>':''}</span></div>
        ${it.titulo?`<div style="color:var(--mute);margin-top:6px;">${esc(it.titulo)}</div>`:''}
        ${(lido||cad||nota)?`<div class="grade">
          ${lido?`<div><div class="label" style="margin-bottom:8px;">Lido no título</div>${lido}</div>`:''}
          ${(cad||nota)?`<div><div class="label" style="margin-bottom:8px;">No cadastro da COBRASQ</div>${cad}${nota}</div>`:''}
        </div>`:''}
        <div style="margin-top:10px;">${ps.map((p,i)=>pergHtml(p,i+1)).join('')}</div></div>`;
    }).join('');
    const chip=(k,l)=>`<button class="chip ${filtro===k?'on':''}" data-filtro="${k}">${l}</button>`;
    app.innerHTML=cabeca()+`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">
          <div><strong id="feitas">${feitas}</strong> de <strong>${total}</strong> perguntas respondidas</div>
          <div style="display:flex;gap:8px;">${chip('todos','Todos os títulos')}${chip('faltam','Só o que falta')}</div></div>
        <div class="barra"><div id="barra" style="width:${pct}%;"></div></div></div>
      ${cardGeral}${cards||'<div class="card" style="text-align:center;padding:32px;color:var(--mute);">Todos os títulos já foram respondidos.</div>'}`;
    Object.entries(rasc).forEach(([k,v])=>{ const t=document.getElementById('r-'+k); if(t && t.value!==v) t.value=v; });
  }

  // Depois de salvar, atualiza só o que mudou: status da pergunta, progresso e selo do título.
  // Não redesenha a página, para não tirar o foco nem o texto de quem já está no próximo campo.
  function atualizar(p){
    const s=document.getElementById('s-'+p.id); if(s) s.innerHTML=status(p);
    const total=st.perg.length, feitas=st.perg.filter(x=>x.resposta).length;
    const f=document.getElementById('feitas'); if(f) f.textContent=feitas;
    const b=document.getElementById('barra'); if(b) b.style.width=Math.round(feitas*100/total)+'%';
    if(p.item_id){ const o=document.getElementById('ok-'+p.item_id); if(o) o.innerHTML=okItem(p.item_id)?'<span class="ok">CONFERIDO</span>':''; }
  }

  const gravando={}, deNovo={};
  async function salvar(id, doBlur){
    const p=st.perg.find(x=>String(x.id)===String(id)); if(!p) return;
    // Uma gravação por pergunta de cada vez; o que mudar no meio grava em seguida.
    if(gravando[id]){ deNovo[id]=true; return; }
    const ta=document.getElementById('r-'+id); if(!ta) return;
    const txt=ta.value.trim();
    const s=document.getElementById('s-'+id);
    if(txt===(p.resposta||'')){ if(!doBlur && s) s.innerHTML='<span style="color:var(--mute);">Nada mudou nesta resposta.</span>'; return; }
    if(s) s.innerHTML='<span style="color:var(--mute);">Salvando…</span>';
    gravando[id]=true;
    let r;
    try{ r=await supa.rpc('conferencia_responder_link',{ p_token:token, p_pergunta_id:id, p_resposta:txt }); }
    catch(e){ r={ error:{ message:'sem conexão' } }; }
    finally{ gravando[id]=false; }
    const { data, error }=r;
    if(error){ const s2=document.getElementById('s-'+id); if(s2) s2.innerHTML=`<span class="erro">Não foi salva: ${esc(error.message||'erro')}</span>`; deNovo[id]=false; return; }
    p.resposta=(data&&data.resposta)||null; p.respondida_em=(data&&data.respondida_em)||null;
    atualizar(p);
    if(deNovo[id]){ deNovo[id]=false; salvar(id,true); }
  }

  app.addEventListener('focusout',e=>{ const id=e.target&&e.target.dataset&&e.target.dataset.id; if(id) salvar(id,true); });
  app.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.salvar) salvar(b.dataset.salvar,false);
    else if(b.dataset.filtro){ filtro=b.dataset.filtro; desenhar(); }
  });

  async function iniciar(){
    if(!/^[0-9a-f]{48}$/.test(token)){ aviso('Link incompleto','Abra o link exatamente como você recebeu. Se não der certo, peça um novo à COBRASQ.'); return; }
    try{
      const r=await fetch('/api/config'); const cfg=await r.json();
      supa=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{ auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
    }catch(_){ aviso('Sem conexão','Não foi possível falar com o servidor. Tente de novo em instantes.'); return; }
    const { data, error }=await supa.rpc('conferencia_por_link',{ p_token:token });
    if(error){ aviso('Link desativado',/válido|desativado/i.test(error.message||'')?'Este link não vale mais. Peça um novo à COBRASQ.':'Não foi possível carregar: '+(error.message||'erro')); return; }
    st={ cliente:data.cliente||'', itens:data.itens||[], perg:data.perguntas||[] };
    desenhar();
  }
  iniciar();
})();
</script>
</body>
</html>
